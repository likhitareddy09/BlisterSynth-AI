<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BlisterSynth AI - synthetic packaging line sensor generator for predictive maintenance." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23174135'/%3E%3Ccircle cx='11' cy='16' r='5' fill='%23B9CAC7'/%3E%3Ccircle cx='22' cy='16' r='5' fill='%237F9783'/%3E%3C/svg%3E" />
    <title>BlisterSynth AI</title>
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      try {
        var t = localStorage.getItem("bs-theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
